name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - refactor/navigation-information-architecture

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare local environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting of production and focused tests
        run: >-
          dart format --output=none --set-exit-if-changed
          lib
          test/app_biometric_lock_service_test.dart
          test/role_permissions_navigation_test.dart

      - name: Analyze production code
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Run stable unit and widget tests
        run: >-
          flutter test
          test/app_biometric_lock_service_test.dart
          test/role_permissions_navigation_test.dart
          test/excel_attendance_import_parser_test.dart
          test/temporary_employee_lifecycle_test.dart
          test/widget_test.dart

      - name: Build debug APK
        run: flutter build apk --debug
