name: hr_employee_system
description: "HR employee and admin system using Flutter and Appwrite Cloud."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  appwrite: ^25.3.0
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5
  local_auth: ^3.0.1
  shared_preferences: ^2.5.5
  file_picker: ^11.0.2
  archive: ^4.0.9
  xml: ^6.6.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  dart_appwrite: ^26.1.0

flutter:
  uses-material-design: true
  assets:
    - .env
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo.ttf
